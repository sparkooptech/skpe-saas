name: Deploy SKPE-SAAS HOMOL

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      database_only:
        description: Apply SK-DA migrations without frontend deployment
        type: boolean
        default: false
      cntcoop_history_2024_2025:
        description: Import verified CNTCOOP 2024 and 2025 historical indices
        type: boolean
        default: false
      cntcoop_import_2026:
        description: Import complete CNTCOOP 2026 AA (declared answers + official metrics) into sparks_homol
        type: boolean
        default: false
      cntcoop_governance_index_2026:
        description: Import verified 2026 governance AA index from official report
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skpe-saas-homol-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build And Deploy Exact Commit
    runs-on: ubuntu-latest
    env:
      RELEASE_PREFIX: skpe-saas-homol
      SPARKS_PUBLIC_HOST: sparks-homol.sparkoop.com.br
      SPARKS_CANONICAL_HOST: sparks.sparkoop.com
      SPARKS_ROUTER_RULE: 'Host(`sparks-homol.sparkoop.com.br`) || Host(`sparks.sparkoop.com`)'
      PREVIEW_BIND: 127.0.0.1:18080:8080
      SSH_PORT: 22
      HOSTINGER_FALLBACK_IP: 179.198.118.251
    steps:
      - name: Check Out Exact Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Derive Release Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          release_name="${RELEASE_PREFIX}-${short_sha}"
          release_dir="/docker/${release_name}"
          image_name="${RELEASE_PREFIX}:${short_sha}"

          {
            echo "short_sha=${short_sha}"
            echo "release_name=${release_name}"
            echo "release_dir=${release_dir}"
            echo "image_name=${image_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build Release Bundle
        shell: bash
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/release"
          mkdir -p "${release_root}/source"
          cp -R deploy/hostinger/skpe-saas-homol/. "${release_root}/"
          cp supabase/migrations/20261022175806_normalize_skda_self_assessment_intelligence.sql "${release_root}/"
          cp supabase/migrations/20261022192348_add_skda_evidence_intelligence_engine.sql "${release_root}/"
          cp supabase/migrations/20261023113000_prepare_skda_pdgc_cycle_import.sql "${release_root}/"
          cp supabase/migrations/20261026004500_govern_skda_assessment_instrument_and_leadership.sql "${release_root}/"
          cp supabase/migrations/20261026043000_enable_skda_artifact_text_versions.sql "${release_root}/"
          cp supabase/migrations/20261026103000_operationalize_skda_organizational_intelligence.sql "${release_root}/"
          cp supabase/migrations/20261026111500_reconcile_cntcoop_recent_evidence_to_core.sql "${release_root}/"
          cp supabase/migrations/20261027234500_govern_skda_contractual_journey_prefill.sql "${release_root}/"
          cp supabase/migrations/20261028010625_enrich_skda_evidence_governance.sql "${release_root}/"
          cp supabase/migrations/20261028014500_create_module_scoped_user_picker.sql "${release_root}/"
          cp supabase/migrations/20261028020000_govern_skda_contractual_lb0_and_current_plan.sql "${release_root}/"
          cp supabase/migrations/20261028113000_govern_skda_question_evidence_expectations.sql "${release_root}/"
          cp supabase/migrations/20261029130000_operationalize_skda_interview_execution.sql "${release_root}/"
          cp supabase/migrations/20261029133000_govern_skda_interview_question_prompts.sql "${release_root}/"
          cp supabase/migrations/20261029150000_decouple_skda_interview_plan_from_question_execution.sql "${release_root}/"
          cp supabase/migrations/20261029152000_make_skda_interview_agenda_propositional.sql "${release_root}/"
          cp supabase/migrations/20261029132012_add_skda_folder_evidence_discovery.sql "${release_root}/"
          cp supabase/migrations/20261029163500_reconcile_cntcoop_contractual_workload.sql "${release_root}/"
          git archive \
            --format=tar.gz \
            --output "${release_root}/source/skpe-saas-${{ steps.meta.outputs.short_sha }}.tar.gz" \
            "${GITHUB_SHA}"

      - name: External Public Baseline Preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC DNS VALIDATION DEFERRED"
          echo "Reason: ${SPARKS_PUBLIC_HOST} missing from authoritative DNS."
          echo "TODO: Restore public-domain preflight and post-deploy smoke test after ${SPARKS_PUBLIC_HOST} is restored in authoritative DNS."

      - name: Configure SSH
        shell: bash
        env:
          RAW_HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          RAW_HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          HOSTINGER_HOST="$(printf '%s' "${RAW_HOSTINGER_HOST}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          HOSTINGER_USER="$(printf '%s' "${RAW_HOSTINGER_USER}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "${HOSTINGER_HOST}" ]; then
            echo "::error::HOSTINGER_HOST is empty after trimming."
            exit 1
          fi

          if [ -z "${HOSTINGER_USER}" ]; then
            echo "::error::HOSTINGER_USER is empty after trimming."
            exit 1
          fi

          echo "SSH_PORT=${SSH_PORT}"
          echo "HOSTINGER_HOST length=${#HOSTINGER_HOST}"
          echo "HOSTINGER_USER length=${#HOSTINGER_USER}"

          if command -v getent >/dev/null 2>&1; then
            echo "::group::DNS resolution"
            getent hosts "${HOSTINGER_HOST}" || true
            echo "::endgroup::"
          fi

          if command -v timeout >/dev/null 2>&1; then
            echo "::group::TCP connectivity"
            if timeout 10 bash -c ":</dev/tcp/${HOSTINGER_HOST}/${SSH_PORT}" 2>/dev/null; then
              echo "TCP_CONNECT_OK ${HOSTINGER_HOST}:${SSH_PORT}"
            else
              echo "TCP_CONNECT_FAIL ${HOSTINGER_HOST}:${SSH_PORT}"
            fi
            echo "::endgroup::"
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${HOSTINGER_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "::group::ssh-keyscan hostname"
          if ssh-keyscan -T 10 -p "${SSH_PORT}" "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts; then
            echo "SSH_KEYSCAN_HOSTNAME_OK"
          else
            echo "SSH_KEYSCAN_HOSTNAME_FAIL"

            if [ "${HOSTINGER_HOST}" = "${HOSTINGER_FALLBACK_IP}" ]; then
              echo "::error::ssh-keyscan failed for HOSTINGER_HOST and no alternate fallback is available."
              exit 1
            fi

            echo "::group::ssh-keyscan fallback IPv4"
            if ssh-keyscan -T 10 -p "${SSH_PORT}" "${HOSTINGER_FALLBACK_IP}" >> ~/.ssh/known_hosts; then
              HOSTINGER_HOST="${HOSTINGER_FALLBACK_IP}"
              echo "SSH_KEYSCAN_FALLBACK_IP_OK"
            else
              echo "::error::ssh-keyscan failed for both hostname and fallback IPv4."
              exit 1
            fi
            echo "::endgroup::"
          fi
          echo "::endgroup::"

          {
            echo "HOSTINGER_HOST=${HOSTINGER_HOST}"
            echo "HOSTINGER_USER=${HOSTINGER_USER}"
          } >> "${GITHUB_ENV}"


      - name: Prepare Remote Release Directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "mkdir -p '${{ steps.meta.outputs.release_dir }}'"

      - name: Upload Release Bundle
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${SSH_PORT}" -r \
            "${RUNNER_TEMP}/release/." \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${{ steps.meta.outputs.release_dir }}/"

      - name: Write Remote Environment File
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.SKPE_SAAS_HOMOL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SKPE_SAAS_HOMOL_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/release/.env"
          {
            printf 'IMAGE_NAME=%s\n' '${{ steps.meta.outputs.image_name }}'
            printf 'PREVIEW_BIND=%s\n' "${PREVIEW_BIND}"
            printf 'SPARKS_PUBLIC_HOST=%s\n' "${SPARKS_PUBLIC_HOST}"
            printf "SPARKS_ROUTER_RULE='%s'\n" "${SPARKS_ROUTER_RULE}"
            printf 'VITE_SUPABASE_URL=%s\n' "${VITE_SUPABASE_URL}"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "${VITE_SUPABASE_PUBLISHABLE_KEY}"
          } > "${env_file}"
          scp -P "${SSH_PORT}" \
            "${env_file}" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${{ steps.meta.outputs.release_dir }}/.env"

      - name: Apply SK-DA Intelligence Migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration_file in \
            20261022175806_normalize_skda_self_assessment_intelligence.sql \
            20261022192348_add_skda_evidence_intelligence_engine.sql \
            20261023113000_prepare_skda_pdgc_cycle_import.sql \
            20261026004500_govern_skda_assessment_instrument_and_leadership.sql \
            20261026043000_enable_skda_artifact_text_versions.sql \
            20261026103000_operationalize_skda_organizational_intelligence.sql \
            20261026111500_reconcile_cntcoop_recent_evidence_to_core.sql \
            20261027234500_govern_skda_contractual_journey_prefill.sql \
            20261028010625_enrich_skda_evidence_governance.sql \
            20261028014500_create_module_scoped_user_picker.sql \
            20261028020000_govern_skda_contractual_lb0_and_current_plan.sql \
            20261028113000_govern_skda_question_evidence_expectations.sql \
            20261029130000_operationalize_skda_interview_execution.sql \
            20261029133000_govern_skda_interview_question_prompts.sql \
            20261029150000_decouple_skda_interview_plan_from_question_execution.sql \
            20261029152000_make_skda_interview_agenda_propositional.sql \
            20261029132012_add_skda_folder_evidence_discovery.sql \
            20261029163500_reconcile_cntcoop_contractual_workload.sql
          do
            echo "Applying ${migration_file}"
            ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
              "docker exec -i postgresql-33th-postgresql-1 sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d sparks_homol' < '${{ steps.meta.outputs.release_dir }}/${migration_file}'"
          done

      - name: Deploy Remote Release
        if: ${{ !inputs.database_only }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "cd '${{ steps.meta.outputs.release_dir }}' && chmod +x deploy-remote.sh && GITHUB_SHA='${GITHUB_SHA}' RELEASE_SHORT_SHA='${{ steps.meta.outputs.short_sha }}' ./deploy-remote.sh"

      - name: Public Domain Smoke Test
        if: ${{ !inputs.database_only }}
        shell: bash
        run: |
          set -euo pipefail
          assert_public_url() {
            local url="$1"
            local body_match="${2:-}"
            local body_file
            body_file="$(mktemp)"

            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location "${url}" > "${body_file}"; then
                if [ -z "${body_match}" ] || grep -Eq "${body_match}" "${body_file}"; then
                  rm -f "${body_file}"
                  return 0
                fi
              fi

              sleep 5
            done

            rm -f "${body_file}"
            return 1
          }

          assert_public_url "https://${SPARKS_CANONICAL_HOST}/healthz"
          assert_public_url "https://${SPARKS_CANONICAL_HOST}/login"
          assert_public_url "https://${SPARKS_CANONICAL_HOST}/" 'Plataforma SPARKs|<div id="root">'

      - name: CNTCOOP read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "docker exec -i postgresql-33th-postgresql-1 sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d sparks_homol'" <<'SQL'
          begin read only;
          select 'ORGANIZATION' as kind, to_jsonb(o) as record from public.organizations o where to_jsonb(o)::text ilike '%CNTCOOP%';
          select 'JOURNEY' as kind, to_jsonb(d) as record from public.skda_diagnoses d where d.organization_id in (select id from public.organizations o where to_jsonb(o)::text ilike '%CNTCOOP%');
          select 'INITIATIVE' as kind, to_jsonb(i) as record from public.sparks_initiatives i where i.organization_id in (select id from public.organizations o where to_jsonb(o)::text ilike '%CNTCOOP%');
          select 'CATALOG' as kind,id,code,version_code,status from public.skda_catalog_versions order by code,version_code;
          select 'QUESTIONS' as kind,cv.code,cv.version_code,count(q.id) as total,count(*) filter(where q.axis_name ilike '%Govern%') as gov,count(*) filter(where q.axis_name ilike '%Gest%') as ges from public.skda_catalog_versions cv left join public.skda_questions q on q.catalog_version_id=cv.id group by cv.code,cv.version_code;
          select 'SNAPSHOTS' as kind,assessment_cycle_year,source_section,count(*) from public.skda_self_assessment_snapshots where organization_id='bd58a170-b5ef-4150-9b69-026afa138661' group by 2,3;
          select 'ANSWERS' as kind,count(*) from public.skda_self_assessment_answers a join public.skda_self_assessment_snapshots s on s.id=a.snapshot_id where s.organization_id='bd58a170-b5ef-4150-9b69-026afa138661';
          select 'CORE_EVIDENCE' as kind,count(*) as assets,count(*) filter(where source_external_key like 'sharepoint:%') as sharepoint_assets from public.sparks_evidence_assets where organization_id='bd58a170-b5ef-4150-9b69-026afa138661' and archived_at is null;
          select 'DA_EVIDENCE' as kind,count(distinct evidence_asset_id) as distinct_assets,count(*) as correlations from public.skda_evidence_correlations where diagnosis_id='79f8b0dc-371e-4483-bfad-542cdbb37724';
          select 'INTELLIGENCE' as kind,analysis_status,count(*) from public.skda_evidence_question_intelligence where diagnosis_id='79f8b0dc-371e-4483-bfad-542cdbb37724' group by analysis_status order by analysis_status;
          select 'INTELLIGENCE_FINDINGS' as kind,count(*) from public.skda_findings where diagnosis_id='79f8b0dc-371e-4483-bfad-542cdbb37724' and metadata->>'origin'='organizational_intelligence';
          select 'RECENT_CORE_ASSET' as kind,title,validation_status,reliability_level,source_external_key from public.sparks_evidence_assets where organization_id='bd58a170-b5ef-4150-9b69-026afa138661' and source_external_key like 'sharepoint:%' and archived_at is null order by title;
          select 'RICARDO_PROFILE' as kind,p.id,p.email,p.display_name,p.active from public.profiles p where lower(coalesce(p.email,'')) like '%ricardo%rodrigues%' or lower(coalesce(p.display_name,'')) like 'ricardo rodrigues%';
          select 'CNTCOOP_MEMBERSHIP' as kind,m.user_id,p.email,p.display_name,m.status,m.is_organization_admin,m.valid_from,m.valid_until,m.job_title from public.organization_memberships m join public.profiles p on p.id=m.user_id where m.organization_id='bd58a170-b5ef-4150-9b69-026afa138661' order by p.display_name,p.email;
          select 'CNTCOOP_EAP' as kind,a.code,a.name,a.baseline_start_date,a.baseline_due_date,a.planned_start_date,a.planned_due_date from public.sparks_initiative_actions a where a.organization_id='bd58a170-b5ef-4150-9b69-026afa138661' and a.parent_action_id is null and a.source_module_code='SK-DA' order by a.code;
          commit;
          SQL

      - name: Import complete CNTCOOP 2026 AA (explicit dispatch only)
        if: ${{ inputs.cntcoop_import_2026 && inputs.database_only }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_cntcoop_2026_import.py > /tmp/cntcoop-aa-2026-import.sql
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "docker exec -i postgresql-33th-postgresql-1 sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d sparks_homol'" < /tmp/cntcoop-aa-2026-import.sql

      - name: Import CNTCOOP 2026 Governance AA official index
        if: ${{ inputs.cntcoop_governance_index_2026 && inputs.database_only }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "docker exec -i postgresql-33th-postgresql-1 sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d sparks_homol'" < scripts/cntcoop-aa-2026-governance-index.sql

      - name: Import CNTCOOP verified 2024-2025 historical indices
        if: ${{ inputs.cntcoop_history_2024_2025 && inputs.database_only }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "docker exec -i postgresql-33th-postgresql-1 sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d sparks_homol'" < scripts/cntcoop-history-2024-2025.sql
