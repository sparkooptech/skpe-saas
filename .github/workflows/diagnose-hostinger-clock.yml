name: Diagnose Hostinger Clock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: 22
      HOSTINGER_FALLBACK_IP: 179.198.118.251
    steps:
      - name: Configure SSH
        shell: bash
        env:
          RAW_HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          RAW_HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOSTINGER_HOST="$(printf '%s' "${RAW_HOSTINGER_HOST}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          HOSTINGER_USER="$(printf '%s' "${RAW_HOSTINGER_USER}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${HOSTINGER_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "${SSH_PORT}" "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts
          {
            echo "HOSTINGER_HOST=${HOSTINGER_HOST}"
            echo "HOSTINGER_USER=${HOSTINGER_USER}"
          } >> "${GITHUB_ENV}"

      - name: Compare clocks
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -p "${SSH_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" '
            echo "HOST_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HOST_EPOCH=$(date +%s)"
            echo "--- CONTAINERS ---"
            docker ps --format "{{.Names}}"
            echo "--- CONTAINER CLOCKS ---"
            for c in $(docker ps --format "{{.Names}}"); do
              printf "%s|" "$c"
              docker exec "$c" date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "no-date"
            done
          '
